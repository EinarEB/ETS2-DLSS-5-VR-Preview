[ADDON]
AddonPath=.
OverlayCollapsed=Generic Depth,Effect Runtime Sync

[GENERAL]
EffectSearchPaths=.\fx\**
TextureSearchPaths=.\fx\**
IntermediateCachePath=@@ROOT@@\cache
PerformanceMode=0
NoDebugInfo=1
NoEffectCache=0
SkipLoadingDisabledEffects=1
PreprocessorDefinitions=RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0,RESHADE_DEPTH_INPUT_IS_REVERSED=0,RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=1000.0,DLSS5_MV_PROVIDER=6,DLSS5_STEREO_DEPTH=1,DLSS5_STEREO_DEPTH_REVERSED=1
PresetPath=.\Reshade presets\ETS2_VR_Preview_Cooler.ini

[INPUT]
KeyOverlay=36,0,0,0
KeyScreenshot=44,0,0,0
KeyEffects=0,0,0,0
ForceShortcutModifiers=1
InputProcessing=2

[OVERLAY]
TutorialProgress=4
AutoSavePreset=1
ShowFrameTime=1
ShowFPS=1
ShowScreenshotMessage=1

[STYLE]
FontScale=1.6

[SCREENSHOT]
SavePath=@@ROOT@@\screenshots
FileFormat=1
SaveOverlayShot=1
ClearAlpha=1
FileNaming=%AppName% %Date% %Time%_%Count%

[PROXY]
EnableProxyLibrary=1
ProxyLibrary=@@SNOWY@@

[RenoDX.DLSS5]
NeuralUplift=1
NRAutoMask=0
NREnableUpscaling=0
NRIntensity=2
NRLocalStructure=0.5
NRLocalTone=1
NRMVecScaleX=1
NRMVecScaleY=1
NRPreset=1
NRSkinStructure=1
NRStyle=1
NRUICorrection=0

